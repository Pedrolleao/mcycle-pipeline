# mcycle-pipeline — accuracy regression gate (CI)
#
# Fails the build when the accuracy on the 49-genome reference panel drops below the
# floors of validation/test_regression.py. Everything it needs is in the repo: the
# smoke and reference rosters (test_panel/panel.tsv, validation/panel.tsv) are fetched
# from NCBI, the KOfam profiles come from the pinned snapshot in resources/kofam_pinned/,
# and both ground truths are committed, so no KEGG access is required. The BLAST seeds
# are fetched from UniProt.

name: regression
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  accuracy-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}        # login shell so the conda env stays active
    steps:
      - uses: actions/checkout@v4

      - name: Set up the cycle-pipeline conda env
        uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: envs/mcycle.yaml
          cache-environment: true

      - name: Cache the reference panel
        uses: actions/cache@v4
        with:
          path: ../ref_panel
          key: ref-panel-${{ hashFiles('validation/panel.tsv') }}

      - name: Build the HMM and BLAST databases
        run: make dbs

      - name: Smoke test (18 genomes, 168 expectations)
        env:
          MCYCLE_ENV: cycle-pipeline
        run: make smoke

      - name: Accuracy regression gate (49 genomes)
        env:
          MCYCLE_ENV: cycle-pipeline
        run: make regression
