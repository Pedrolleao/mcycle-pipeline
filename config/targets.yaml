    category: methylotrophic_methanogenesis
    ko: [K16176]
    blast_fallback: false
    notes: "Pyrrolysine-containing: the gene has an in-frame amber (UAG) codon, so a gene caller splits it in two. It is still called from genome input when one half passes the KOfam threshold on its own (the case in the smoke panel) or when apply_rules.join_inframe_stops can add the two halves; an annotated proteome may omit it altogether."
  - id: mtmC
