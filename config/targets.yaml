# ─────────────────────────────────────────────────────────────────────────────
# targets.yaml — single source of truth for the methane-cycle detection pipeline.
#
# Modeled on Sulfur_Cycle/scycle-pipeline/config/targets.yaml (same schema, same
# engine). Three blocks:
#   targets:    individual enzymes/genes. Each carries KO (primary anchor), optional
#               Pfam anchors, an optional custom-HMM tier, and a BLAST
#               fallback/confirmation gate.
#   complexes:  obligatory multi-subunit assemblies. Scored n/N per genome.
#   synergies:  process-completeness modules (hydrogenotrophic / acetoclastic /
#               methylotrophic methanogenesis, reverse methanogenesis, aerobic
#               methane oxidation, ...). `requires:` lists genes that must all be
#               present; `requires_any:` lists slots, each satisfied by any ONE of
#               its alternatives (an alternative is a gene or a list of genes);
#               `key:` lists what DEFINES the module — every entry must be
#               present (an entry that is a list is satisfied by any one of its
#               genes), otherwise the module is ruled out however many shared
#               genes (Mcr, Mtr, pMMO, ...) the genome carries.
#
# Detection is KO-primary: build_hmm_db.py extracts the KOfam profile + adaptive
# threshold for every `ko:` here. Every KO below was verified against the cached
# KOfam `ko_list` (release 2026-05-24); every Pfam id against the InterPro API;
# every `blast_refs_uniprot` accession against the UniProt REST API (2026-10-04:
# protein name, organism, full length, not a fragment). Empty `blast_refs_uniprot`
# means the target is called on its KO alone — seeds are CURATED, never guessed.
#
# ⚠️ HOMOLOGY / DIRECTIONALITY TRAPS:
#   mcrABG       methanogenesis vs REVERSE methanogenesis (ANME, anaerobic methane
#                oxidation) — same enzyme, opposite direction. Resolved by the
#                ANME-clade McrA gate (`mcrA_anme`) in
#                apply_rules.resolve_mcr_direction + the direction rule on the
#                methanogenesis / reverse_methanogenesis_aom synergies.
#   pmoABC       particulate methane monooxygenase vs ammonia monooxygenase
#                (amoABC) — one copper-monooxygenase family; KOs K10945/K10946 are
#                shared verbatim. pmoA is BLAST-gated to methanotroph-clade seeds;
#                pmoB/pmoC follow the pmoA call (apply_rules.gate_pmo_subunits).
#   fwdABC, ftr, mch   the H4MPT C1 module is shared between methanogens
#                (reductive, CO2 → methyl) and methylotrophic bacteria (oxidative,
#                formaldehyde → formate; Fhc complex = FwdABC + Ftr homologues).
#                Direction is inferred at the synergy / cycle-map layer, not per gene.
#   mmoX         soluble methane monooxygenase vs other soluble di-iron
#                monooxygenases (propane / butane / phenol / toluene) — KO K16157
#                is specific; BLAST seeds corroborate.
#   ack, pta, acs, hdrABC, cdh   widespread outside methanogens — interpreted only
#                at the synergy layer (which also requires mcr).
# ─────────────────────────────────────────────────────────────────────────────

targets:

  # ── 1. Mcr / Mtr core — methanogenesis and reverse methanogenesis (ANME) ───
  - id: mcrA
    name: Methyl-coenzyme M reductase alpha subunit
    category: mcr_core
    ko: [K00399]
    pfam: [PF02249, PF02745]
    blast_fallback: true
    blast_identity_min: 50
    blast_refs_uniprot: [P11558, P58815, P07962, Q58256, P07961, Q49605, R9TAZ9, A0A284VQI9]   # Methanothermobacter marburgensis McrI + McrII, Methanosarcina barkeri, Methanocaldococcus jannaschii, Methanococcus vannielii, Methanopyrus kandleri (all reviewed) + Methanomassiliicoccus intestinalis + Ca. Methanoperedens (ANME-2d)
    ref_query: "Methanothermobacter marburgensis[organism] AND mcrA[gene]"
    gate_rationale: "50 = floor between canonical McrA and alkyl-CoM reductases. Measured 2026-10-04: methanogen McrA across orders are >=55% identical to the nearest seed; the ethyl-CoM reductase of Ca. Ethanoperedens (A0A7R9R780) is 42-45% to every McrA seed. Not a hard gate (blast_fallback only): a KO hit with no seed >=50% is reported as domain-only."
    notes: "⚠️ DIRECTION TRAP: the same enzyme makes methane in methanogens and activates it in ANME archaea (reverse methanogenesis). The direction call is made by resolve_mcr_direction (see mcrA_anme). KOfam K00399 (TC 775.5) already excludes the divergent alkyl-CoM reductases: Ethanoperedens ECR scores 643, canonical McrA >=1000, ANME-2d ~915."
  - id: mcrB
    name: Methyl-coenzyme M reductase beta subunit
    category: mcr_core
    ko: [K00401]
    pfam: [PF02241]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND mcrB[gene]"
  - id: mcrG
    name: Methyl-coenzyme M reductase gamma subunit
    category: mcr_core
    ko: [K00402]
    pfam: [PF02240]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND mcrG[gene]"
  - id: mcrC
    name: Methyl-coenzyme M reductase operon protein C
    category: mcr_core
    ko: [K03421]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND mcrC[gene]"
    notes: "Accessory (mcrBDCGA operon); part of the Mcr activation machinery. Not required by any module."
  - id: mcrD
    name: Methyl-coenzyme M reductase operon protein D
    category: mcr_core
    ko: [K03422]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND mcrD[gene]"
    notes: "Accessory (assembly chaperone). Not required by any module."
  - id: mcrA_anme
    name: Methyl-coenzyme M reductase alpha subunit — ANME clade (reverse methanogenesis)
    category: mcr_core
    ko: [K00399]
    pfam: [PF02249, PF02745]
    custom_hmm: true
    clade_hmm_required: true   # decided by the clade HMMs of targets/mcrA_anme/ (manifest.yaml); the BLAST seeds are reported as nearest reference only
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 80
    blast_refs_uniprot: [A0A284VQI9]   # Ca. Methanoperedens nitratireducens McrA (ANME-2d, 567 aa). A0A062V7W6 (the ANME-2d genome of the smoke panel) is deliberately NOT a seed.
    ref_query: "Candidatus Methanoperedens[organism] AND mcrA[gene]"
    gate_rationale: "80 sits in the measured gap (2026-10-04): the two available Ca. Methanoperedens McrA are 96% identical to each other, while the closest methanogen McrA (Methanosarcina barkeri / acetivorans) are 68-70% identical to the seed and Methanothrix 63-65%."
    notes: "⚠️ CLADE GATE, ANME-2d ONLY SO FAR. The same protein as mcrA, called a second time against ANME-clade seeds: confirmed here ⇒ the genome's Mcr is called `reverse`; in a methanogen this target is `disqualified` (McrA present, not an ANME clade). No function-verified full-length UniProt McrA was found for the marine ANME-1 / ANME-2a / ANME-2c / ANME-3 clades, so those are NOT yet seeded and are called methanogenic — see Info-methane.md, hardening backlog."
  - id: mtrA
    name: Tetrahydromethanopterin S-methyltransferase subunit A
    category: mcr_core
    ko: [K00577]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND mtrA[gene]"
    notes: "Mtr: methyl-H4MPT + CoM → methyl-CoM, the sodium-pumping step. Absent from the H2-dependent methylotrophic methanogens (Methanomassiliicoccales, Methanosphaera-type)."
  - id: mtrB
    name: Tetrahydromethanopterin S-methyltransferase subunit B
    category: mcr_core
    ko: [K00578]
    blast_fallback: false
  - id: mtrC
    name: Tetrahydromethanopterin S-methyltransferase subunit C
    category: mcr_core
    ko: [K00579]
    blast_fallback: false
  - id: mtrD
    name: Tetrahydromethanopterin S-methyltransferase subunit D
    category: mcr_core
    ko: [K00580]
    blast_fallback: false
  - id: mtrE
    name: Tetrahydromethanopterin S-methyltransferase subunit E
    category: mcr_core
    ko: [K00581]
    blast_fallback: false
  - id: mtrF
    name: Tetrahydromethanopterin S-methyltransferase subunit F
    category: mcr_core
    ko: [K00582]
    blast_fallback: false
    notes: "Very small subunit (~70 aa); often missed by gene callers or fused to mtrA."
  - id: mtrG
    name: Tetrahydromethanopterin S-methyltransferase subunit G
    category: mcr_core
    ko: [K00583]
    blast_fallback: false
    notes: "Very small subunit (~75 aa)."
  - id: mtrH
    name: Tetrahydromethanopterin S-methyltransferase subunit H
    category: mcr_core
    ko: [K00584]
    blast_fallback: false

  # ── 2. CO2 reduction — the H4MPT C1 module (CO2 → methyl-H4MPT) ────────────
  - id: fwdA
    name: Formylmethanofuran dehydrogenase subunit A (FwdA/FmdA; FhcA in methylotrophs)
    category: co2_reduction
    ko: [K00200]
    blast_fallback: false
    ref_query: "Methanothermobacter marburgensis[organism] AND fwdA[gene]"
    notes: "⚠️ SHARED: K00200-K00202 also cover FhcA/B/C, the formyltransferase/hydrolase complex of methylotrophic bacteria (formyl-H4MPT → formate). Direction is set at the synergy layer."
  - id: fwdB
    name: Formylmethanofuran dehydrogenase subunit B (FwdB/FmdB; FhcB in methylotrophs)
    category: co2_reduction
    ko: [K00201]
    blast_fallback: false
  - id: fwdC
    name: Formylmethanofuran dehydrogenase subunit C (FwdC/FmdC; FhcC in methylotrophs)
    category: co2_reduction
    ko: [K00202]
    blast_fallback: false
  - id: fwdD
    name: Formylmethanofuran dehydrogenase subunit D
    category: co2_reduction
    ko: [K00203]
    blast_fallback: false
    ko_tc: 110
    tc_rationale: "KOfam 122.93. Training panel 2026-10-04: the two FwdD of Ca. Methylomirabilis oxyfera score 119.6 and 119.2 (KEGG assigns K00203 to both); the best hit in a training genome without FwdD is 39."
    notes: "Archaeal Fwd/Fmd subunit; no counterpart in the bacterial Fhc complex."
  - id: ftr
    name: Formylmethanofuran--tetrahydromethanopterin N-formyltransferase (Ftr; FhcD in methylotrophs)
    category: co2_reduction
    ko: [K00672]
    blast_fallback: false
    ref_query: "Methanopyrus kandleri[organism] AND ftr[gene]"
    notes: "⚠️ SHARED with the methylotroph Fhc complex (FhcD)."
  - id: mch
    name: Methenyltetrahydromethanopterin cyclohydrolase
    category: co2_reduction
    ko: [K01499]
    blast_fallback: false
    ref_query: "Methanopyrus kandleri[organism] AND mch[gene]"
    notes: "⚠️ SHARED: the same enzyme runs reductively in methanogens and oxidatively in methylotrophs / ANME."
  - id: mtd
    name: Methylenetetrahydromethanopterin dehydrogenase (F420-dependent)
    category: co2_reduction
    ko: [K00319]
    blast_fallback: false
    ref_query: "Methanopyrus kandleri[organism] AND mtd[gene]"
  - id: hmd
    name: 5,10-methenyltetrahydromethanopterin hydrogenase (H2-forming, [Fe]-hydrogenase)
    category: co2_reduction
    ko: [K13942]
    blast_fallback: false
    ko_tc: 540
    tc_rationale: "KOfam 575.0. Training panel 2026-10-04: Hmd of Methanopyrus kandleri AV19 scores 566.3 (KEGG: K13942); the next hits in any training genome are the HmdII-type paralogues at <= 72."
    ref_query: "Methanothermobacter marburgensis[organism] AND hmd[gene]"
    notes: "H2-dependent alternative to mtd in hydrogenotrophic methanogens without cytochromes."
  - id: mer
    name: 5,10-methylenetetrahydromethanopterin reductase (F420-dependent)
    category: co2_reduction
    ko: [K00320]
    blast_fallback: false
    ref_query: "Methanopyrus kandleri[organism] AND mer[gene]"
    notes: "ANME-1 lack mer (a MetF-like enzyme is proposed to replace it)."
  - id: fdhA
    name: Formate dehydrogenase (coenzyme F420) alpha subunit
    category: co2_reduction
    ko: [K22516]
    blast_fallback: false
    ref_query: "Methanococcus maripaludis[organism] AND fdhA[gene]"
    notes: "Formate as electron donor for CO2-reducing methanogenesis. A selenoprotein in Methanococcus (in-frame UGA): from genome input the two halves are joined by apply_rules.join_inframe_stops and the call is tagged `joined:`. K22516 and the generic K00123 overlap: archaeal F420-dependent FdhA score 0.72-0.95 of the K22516 threshold and pass K00123, bacterial NAD-dependent FdhA score 0.76-0.86 on K22516. The subunit that tells them apart is the F420-binding FdhB: with fdhB in the genome an FdhA-family protein at >= 0.70 of the K22516 threshold is called fdhA (evidence `fdhB_partner`; apply_rules.resolve_fdh)."
  - id: fdhB
    name: Formate dehydrogenase (coenzyme F420) beta subunit
    category: co2_reduction
    ko: [K00125]
    blast_fallback: false

  # ── 3. Acetoclastic methanogenesis (acetate → CH4 + CO2) ───────────────────
  - id: ackA
    name: Acetate kinase
    category: acetoclastic
    ko: [K00925]
    blast_fallback: false
    notes: "⚠️ Ubiquitous in bacteria. Acetate activation in Methanosarcina (ack + pta); meaningful only inside the acetoclastic module."
  - id: pta
    name: Phosphate acetyltransferase
    category: acetoclastic
    ko: [K00625, K13788]
    ko_tc: 350
    blast_fallback: false
    notes: "⚠️ Ubiquitous in bacteria; see ackA. ko_tc 350: the archaeal Pta of Methanosarcina scores just under the KOfam thresholds (M. acetivorans C2A Pta: 378 on K00625, TC 391.4; measured 2026-10-04), which would break the ack + pta acetate-activation route of the acetoclastic module."
  - id: acs
    name: Acetyl-CoA synthetase (AMP-forming)
    category: acetoclastic
    ko: [K01895]
    blast_fallback: false
    notes: "⚠️ Ubiquitous. Acetate activation in Methanothrix (the obligate acetoclast); also used for acetate ASSIMILATION by hydrogenotrophic methanogens."
  - id: cdhA
    name: CODH/ACS complex subunit alpha (acetyl-CoA decarbonylase/synthase, CO dehydrogenase)
    category: acetoclastic
    ko: [K00192]
    blast_fallback: false
    ref_query: "Methanosarcina thermophila[organism] AND cdhA[gene]"
    notes: "⚠️ The CODH/ACS complex cleaves acetyl-CoA in acetoclasts but SYNTHESIZES it in autotrophic methanogens and in acetogens / sulfate reducers (Wood-Ljungdahl)."
  - id: cdhB
    name: CODH/ACS complex subunit epsilon
    category: acetoclastic
    ko: [K00195]
    blast_fallback: false
  - id: cdhC
    name: CODH/ACS complex subunit beta (acetyl-CoA synthase)
    category: acetoclastic
    ko: [K00193]
    blast_fallback: false
  - id: cdhD
    name: CODH/ACS complex subunit delta (corrinoid Fe-S protein)
    category: acetoclastic
    ko: [K00194]
    blast_fallback: false
  - id: cdhE
    name: CODH/ACS complex subunit gamma (corrinoid Fe-S protein)
    category: acetoclastic
    ko: [K00197]
    blast_fallback: false

  # ── 4. Methylotrophic methanogenesis (methanol / methylamines / methyl sulfides)
  - id: mtaA
