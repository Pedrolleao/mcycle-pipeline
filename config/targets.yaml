# ─────────────────────────────────────────────────────────────────────────────
# Obligatory complexes — must find ALL members for the function to be present.
# ─────────────────────────────────────────────────────────────────────────────
complexes:
  mcr:
    members: [mcrA, mcrB, mcrG]
    obligatory: true
    application: "Methyl-CoM <=> CH4; methanogenesis, or (ANME) reverse methanogenesis — ⚠️ direction set by resolve_mcr_direction"
  mtr:
    members: [mtrA, mtrB, mtrC, mtrD, mtrE, mtrH]
    obligatory: true
    application: "Methyl-H4MPT <=> methyl-CoM (Na+-pumping); needed for CO2-reducing and acetoclastic methanogenesis. The ~70-aa subunits mtrF / mtrG are reported but not required (often fused to mtrA or missed by gene callers)"
  fwd:
    members: [fwdA, fwdB, fwdC, fwdD]
    obligatory: true
    application: "CO2 <=> formyl-methanofuran (methanogens / ANME); the bacterial Fhc complex scores 3/4 (no fwdD)"
  hdr_abc:
    members: [hdrA, hdrB, hdrC]
    obligatory: true
    application: "Soluble electron-bifurcating heterodisulfide reductase (CoM-S-S-CoB reduction)"
  hdr_de:
    members: [hdrD, hdrE]
    obligatory: true
    application: "Membrane-bound heterodisulfide reductase of cytochrome-containing Methanosarcinales"
  mvh_hydrogenase:
    members: [mvhA, mvhG, mvhD]
    obligatory: true
    application: "F420-non-reducing hydrogenase, electron donor to HdrABC"
  frh_hydrogenase:
    members: [frhA, frhB, frhG]
    obligatory: true
    application: "F420-reducing hydrogenase (H2 => F420H2 for mtd / mer)"
  f420_formate_dh:
    members: [fdhA, fdhB]
    obligatory: true
    application: "Formate => F420H2 (formate-dependent methanogenesis)"
  codh_acs:
    members: [cdhA, cdhB, cdhC, cdhD, cdhE]
    obligatory: true
    application: "Acetyl-CoA <=> methyl-H4MPT + CO2 (acetoclastic cleavage, or autotrophic acetyl-CoA synthesis)"
  methanol_methyltransferase:
    members: [mtaA, mtaB, mtaC]
    obligatory: true
    application: "Methanol => methyl-CoM"
  monomethylamine_methyltransferase:
    members: [mtmB, mtmC]
    obligatory: true
    application: "Monomethylamine => methyl-corrinoid (with mtbA => methyl-CoM)"
  dimethylamine_methyltransferase:
    members: [mtbB, mtbC]
    obligatory: true
    application: "Dimethylamine => methyl-corrinoid (with mtbA => methyl-CoM)"
  trimethylamine_methyltransferase:
    members: [mttB, mttC]
    obligatory: true
    application: "Trimethylamine => methyl-corrinoid (with mtbA => methyl-CoM)"
  pmmo:
    members: [pmoA, pmoB, pmoC]
    obligatory: true
    application: "CH4 => CH3OH (particulate, copper methane monooxygenase)"
  smmo_hydroxylase:
    members: [mmoX, mmoY, mmoZ]
    obligatory: true
    application: "CH4 => CH3OH (soluble, di-iron methane monooxygenase; needs mmoB + mmoC)"
  mxa_methanol_dh:
    members: [mxaF, mxaI]
    obligatory: true
    application: "CH3OH => HCHO (calcium-dependent methanol dehydrogenase; xoxF is the lanthanide alternative)"
  malate_thiokinase:
    members: [mtkA, mtkB]
    obligatory: true
    application: "Malate => malyl-CoA (serine cycle)"

# ─────────────────────────────────────────────────────────────────────────────
# Process-completeness modules — scored as completeness fractions, interpreted in
# the gap-analysis report. The four Mcr-dependent modules also carry a direction
# rule (compute_complex_completeness.MCR_DIRECTION_OF): when the genome's Mcr
# direction is called, a module that needs the other direction is ruled out.
# ─────────────────────────────────────────────────────────────────────────────
synergies:
  - name: hydrogenotrophic_methanogenesis
    requires: [fwdA, fwdB, ftr, mch, mer, mtrA, mtrH, mcrA, mcrB, mcrG]
    requires_any:
      - [mtd, hmd]
      - [[frhA, frhB, frhG], [fdhA, fdhB]]
    key: [mcrA]
    benefit: "CO2-reducing methanogenesis (CO2 + 4 H2 => CH4). The last slot is the electron donor: H2 through the F420-reducing hydrogenase Frh, or formate through the F420-dependent Fdh. ⚠️ Genomic potential only — Methanosarcina acetivorans carries frh but does not grow on H2 + CO2."
  - name: acetoclastic_methanogenesis
    requires: [cdhC, cdhD, cdhE, mtrA, mcrA, mcrB, mcrG, hdrD]
    requires_any:
      - [[ackA, pta], acs]
    key: [mcrA, hdrD]
    benefit: "Acetate => CH4 + CO2. Acetate activation by ack + pta (Methanosarcina) or acs (Methanothrix). Key genes mcrA + hdrD: membrane-bound HdrDE marks the cytochrome-containing Methanosarcinales, the only acetoclasts — without it, cdh + acs is autotrophy / acetate assimilation."
  - name: methylotrophic_methanogenesis
    requires: [mcrA, mcrB, mcrG]
    requires_any:
      - [[mtaA, mtaB, mtaC], [mtbA, mtmB, mtmC], [mtbA, mtbB, mtbC], [mtbA, mttB, mttC], [mtsA, mtsB]]
    key: [mcrA, [mtaB, mtmB, mtbB, mttB, mtsA]]
    benefit: "Methanol / methylamines / methyl sulfides => CH4. With mtr + the H4MPT module the methyl groups are also disproportionated to CO2 (Methanosarcina); without mtr and fwd the pathway is H2-dependent (Methanomassiliicoccales). Key genes: the substrate-specific methyltransferases."
  - name: reverse_methanogenesis_aom
    requires: [mcrA, mcrB, mcrG, mtrA, mtrH, mch, ftr, fwdA, fwdB]
    key: [mcrA]
    benefit: "Anaerobic oxidation of methane by ANME archaea (CH4 => CO2 through the methanogenesis pathway run backwards). Needs the Mcr direction call `reverse` (ANME-clade McrA)."
  - name: heterodisulfide_recycling
    requires: [mcrA]
    requires_any:
      - [[hdrA, hdrB, hdrC], [hdrD, hdrE]]
    key: [mcrA]
    benefit: "Regeneration of CoM-SH + CoB-SH from the heterodisulfide — the energy-conserving step every Mcr-based metabolism depends on. Key gene mcrA: Hdr-like enzymes without Mcr (sulfate reducers, acetogens) are not heterodisulfide recycling."
  - name: aerobic_methane_oxidation
    requires_any:
      - [[pmoA, pmoB, pmoC], [mmoX, mmoY, mmoZ]]
      - [[mxaF, mxaI], xoxF]
    key: [[pmoA, mmoX]]
    benefit: "Aerobic methanotrophy: CH4 => CH3OH (pMMO or sMMO) => HCHO (MxaFI or XoxF methanol dehydrogenase)."
  - name: nitrite_dependent_methane_oxidation
    requires: [pmoA, pmoB, pmoC, nod]
    key: [nod]
    benefit: "Intra-aerobic methane oxidation coupled to nitrite reduction (NC10, Ca. Methylomirabilis): NO dismutase supplies the O2 for pMMO."
  - name: methanol_oxidation
    requires_any:
      - [[mxaF, mxaI], xoxF]
    benefit: "CH3OH => HCHO. On its own (no pmo / mmo) this marks a non-methanotrophic methylotroph."
  - name: h4mpt_formaldehyde_oxidation
    requires: [fae, mtdB, mch, ftr, fwdA]
    key: [mtdB]
    benefit: "Formaldehyde => formate through the bacterial H4MPT route (Fae, MtdB, Mch, Fhc; fwdA / ftr stand for FhcA / FhcD). Key gene mtdB: the NAD(P)-dependent dehydrogenase is bacterial — archaea carry fae / mch / ftr / fwd for methanogenesis instead."
  - name: rump_assimilation
    requires: [hxlA, hxlB]
    requires_any:
      - [[mxaF, mxaI], xoxF]
    key: [[mxaF, xoxF]]
    benefit: "Formaldehyde assimilation by the ribulose-monophosphate cycle (gamma-proteobacterial methanotrophs). Key: a methanol dehydrogenase as the formaldehyde source — archaea (methanogens included) run Hps / Phi in reverse to make pentose phosphates. ⚠️ Misses NAD-dependent methanol dehydrogenase (Bacillus methanolicus)."
  - name: serine_cycle
    requires: [sgaA, hprA, mtkA, mtkB, mcl]
    requires_any:
      - [[mxaF, mxaI], xoxF]
    key: [[mxaF, xoxF]]
    benefit: "C1 assimilation by the serine cycle (alpha-proteobacterial methanotrophs and methylotrophs). Key: a methanol dehydrogenase as the C1 source — the serine-cycle enzymes alone also occur in non-methylotrophs (e.g. Nitrosomonas europaea carries all five)."
