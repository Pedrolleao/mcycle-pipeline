    category: energy_conservation
    ko: [K14126]
    blast_fallback: false
  - id: mvhG
    name: F420-non-reducing hydrogenase small subunit (MvhG)
    category: energy_conservation
    ko: [K14128]
    blast_fallback: false
  - id: mvhD
    name: F420-non-reducing hydrogenase iron-sulfur subunit (MvhD)
    category: energy_conservation
    ko: [K14127]
    blast_fallback: false
    hmm_min_qcov: 0.5
    notes: "MvhD is a ~140-residue protein. The same domain is fused to HdrA-type proteins of 500-800 residues in Methanosarcinales, Methanothrix and sulfate reducers, which pass K14127 (204-225, TC 180.1) and which KEGG does not assign to it; the 0.5 query-coverage floor removes them (true MvhD cover > 0.9, the fusions < 0.3; training panel 2026-10-04)."
  - id: frhA
    name: Coenzyme F420-reducing hydrogenase subunit alpha (FrhA)
    category: energy_conservation
    ko: [K00440]
