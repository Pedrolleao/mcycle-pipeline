    blast_fallback: false
    notes: "⚠️ FrhB-like F420-binding subunits also occur in F420-dependent sulfite reductase and formate dehydrogenase."
  - id: frhG
    name: Coenzyme F420-reducing hydrogenase subunit gamma (FrhG)
    category: energy_conservation
    ko: [K00443]
    blast_fallback: false

  # ── 6. Aerobic methane oxidation (CH4 → CH3OH → HCHO) ──────────────────────
  - id: pmoA
    name: Particulate methane monooxygenase subunit A
    category: aerobic_methane_oxidation
    ko: [K10944, K28504]   # K10944 = methane MO subunit A; K28504 = ammonia MO subunit A. Both profiles fire on both enzymes, so both are listed as the signature and the CLADE call is left to the BLAST gate.
    pfam: [PF02461]
    custom_hmm: true
    clade_hmm_required: true   # decided by the clade HMMs of targets/pmoA/ (manifest.yaml); the BLAST seeds are reported as nearest reference only
    requires_blast_for_confirmation: true
    blast_fallback: true
    blast_identity_min: 70
    blast_refs_uniprot: [Q607G3, G4SZ63, G0A0H7, A0A3G8M5C3, A9QPE3, A9QPE6, A0A2T4U1K1, A0A1I3Z8P3]   # Methylococcus capsulatus Bath (reviewed; pMMO crystal structure), Methylotuvimicrobium alcaliphilum 20Z, Methylomonas methanica MC09 (gamma); Methylocystis rosea, Methylocapsa palsarum (alpha); Methylacidiphilum infernorum V4 pmoA1 + pmoA2 (Verrucomicrobia); Ca. Methylomirabilis limnetica (NC10)
    ref_query: "Methylococcus capsulatus[organism] AND pmoA[gene]"
    gate_rationale: "70 sits in the measured gap (2026-10-04, smoke panel): the closest non-target, gamma-AOB amoA (Nitrosococcus oceani), is 63.5% identical to the nearest pmoA seed and beta-AOB amoA (Nitrosomonas europaea) 51.3%; real pmoA reach >=74% to a seed of their own clade WITHOUT their own strain in the seed set (M. capsulatus 78.1 to M. alcaliphilum; Methylosinus trichosporium 88.9 to Methylocystis; M. fumariolicum 93.6 / 99.2 to M. infernorum)."
    notes: "⚠️ TRAP: pmoA and amoA are one family (PF02461); KOfam K10944 and K28504 do not separate methane from ammonia oxidizers. The clade call is the BLAST gate to methanotroph pmoA seeds spanning gamma, alpha, verrucomicrobial and NC10 clades. An ammonia oxidizer's amoA is reported here as `disqualified`. Not seeded: the divergent pxmA / verrucomicrobial pmoA3 paralogues (function unresolved) and the atmospheric-methane clades USC-gamma / most of USC-alpha."
  - id: pmoB
    name: Particulate methane monooxygenase subunit B
    category: aerobic_methane_oxidation
    ko: [K10945]
    pfam: [PF04744]
    blast_fallback: false
    ref_query: "Methylococcus capsulatus[organism] AND pmoB[gene]"
