    category: methylotrophic_methanogenesis
    ko: [K16177]
    blast_fallback: false
  - id: mtbB
    name: Dimethylamine:corrinoid methyltransferase (MtbB)
    category: methylotrophic_methanogenesis
    ko: [K16178]
    blast_fallback: false
    notes: "Pyrrolysine-containing (in-frame UAG); see mtmB."
  - id: mtbC
    name: Dimethylamine corrinoid protein (MtbC)
    category: methylotrophic_methanogenesis
    ko: [K16179]
    blast_fallback: false
  - id: mttB
    name: Trimethylamine:corrinoid methyltransferase (MttB)
    category: methylotrophic_methanogenesis
    ko: [K14083]
    blast_fallback: false
    notes: "⚠️ Pyrrolysine-containing (in-frame UAG); see mtmB. K14083 also covers the non-pyrrolysine MttB superfamily (e.g. glycine-betaine methyltransferases) found in non-methanogenic bacteria."
  - id: mttC
