    category: methylotrophic_methanogenesis
    ko: [K14080]
    ko_tc: 375
    blast_fallback: false
    ref_query: "Methanosarcina barkeri[organism] AND mtaA[gene]"
    notes: "ko_tc 375 (KOfam 382.7): on genome input Prodigal starts the Methanomassiliicoccus luminyensis MtaA 8 residues late and it scores 382.1 — 0.6 under the KOfam threshold — while the same gene from the NCBI annotation passes. Measured 2026-10-04; the next hits in the panel are 360.8 (the MtbA of M. acetivorans, which belongs to K14082) and 351.9, so 375 admits nothing else."
  - id: mtaB
    name: Methanol:corrinoid methyltransferase (MtaB)
    category: methylotrophic_methanogenesis
    ko: [K04480]
    blast_fallback: false
    ref_query: "Methanosarcina barkeri[organism] AND mtaB[gene]"
  - id: mtaC
    name: Methanol corrinoid protein (MtaC)
    category: methylotrophic_methanogenesis
    ko: [K14081]
    blast_fallback: false
  - id: mtbA
    name: Methylcobamide:CoM methyltransferase (methylamine-specific, MtbA)
    category: methylotrophic_methanogenesis
