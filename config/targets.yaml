    category: methylotrophic_methanogenesis
    ko: [K16954]
    blast_fallback: false
    notes: "Dimethylsulfide / methanethiol as methanogenic substrates."
  - id: mtsB
    name: Methylated-thiol corrinoid protein (MtsB)
    category: methylotrophic_methanogenesis
    ko: [K16955]
    blast_fallback: false

  # ── 5. Energy conservation — heterodisulfide reductases and hydrogenases ───
  - id: hdrA
    name: Heterodisulfide reductase subunit A
    category: energy_conservation
    ko: [K03388, K22480]
    blast_fallback: false
    notes: "⚠️ HdrA-like flavoproteins are widespread in non-methanogens (sulfate reducers, acetogens). Electron-bifurcating HdrABC-MvhADG is the heterodisulfide reductase of methanogens without cytochromes."
  - id: hdrB
    name: Heterodisulfide reductase subunit B
    category: energy_conservation
    ko: [K03389, K22481]
    blast_fallback: false
    ko_tc: {K03389: 260}
    tc_rationale: "KOfam 333.63 for K03389. Training panel 2026-10-04: HdrB of Methanothrix soehngenii, M. thermoacetophila and Archaeoglobus fulgidus score 316, 314 and 276 (KEGG: K03389 in all three); the best hit in a genome without HdrB is 90."
  - id: hdrC
    name: Heterodisulfide reductase subunit C
    category: energy_conservation
    ko: [K03390, K22482]
    blast_fallback: false
    ko_tc: {K03390: 100}
    tc_rationale: "KOfam 125.27 for K03390. Training panel 2026-10-04: HdrC of Archaeoglobus fulgidus scores 108 (KEGG: K03390); the best hit in a genome without HdrC is 64."
  - id: hdrD
    name: Heterodisulfide reductase subunit D (membrane-bound HdrDE)
    category: energy_conservation
    ko: [K08264]
    blast_fallback: false
    notes: "HdrDE is the methanophenazine-linked heterodisulfide reductase of the cytochrome-containing Methanosarcinales — the only order with acetoclastic methanogens — and is therefore required by the acetoclastic module."
  - id: hdrE
